<div class="layout-container">

  <app-sidebar-component [isMobileMenuOpen]="mobileMenuOpen"></app-sidebar-component>

  <div class="main-content">

    <!-- Header: always visible -->
    <app-navbar class="layout-header" (mobileMenuToggle)="onMobileMenuToggle($event)"></app-navbar>

    <!-- Body: the only part that scrolls -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer: always visible -->
    <footer class="layout-footer">
      <span>© {{ year }} MarsHRMS. All rights reserved.</span>
      <nav class="footer-links" aria-label="Legal and support">
        <a routerLink="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
        <span aria-hidden="true">·</span>
        <a routerLink="/terms" target="_blank" rel="noopener">Terms of Use</a>
        <span aria-hidden="true">·</span>
        <a href="mailto:support@marstech.tech">Support</a>
      </nav>
    </footer>

  </div>

</div>

<!-- Global toast notification container — renders toasts from ToastService -->
<app-toast></app-toast>
