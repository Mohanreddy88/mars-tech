@if (banners.length) {
  <section class="banners" [class.single]="preview" aria-roledescription="carousel" aria-label="News from the school"
           (mouseenter)="pause(true)" (mouseleave)="pause(false)" (focusin)="pause(true)" (focusout)="pause(false)">
    <div class="track" #track (scroll)="onScroll()" (touchstart)="pause(true)" (touchend)="touchEnd()">
      @for (b of banners; track b.id) {
        <article class="slide" [ngClass]="'theme-' + b.theme" [class.clickable]="!preview && !!b.link" (click)="open(b)">
          @if (b.imageUrl) {
            <div class="picture" [style.background-image]="'url(' + b.imageUrl + ')'"></div>
          } @else {
            <span class="blob"></span>
            <i class="bi art" [ngClass]="iconFor(b)" aria-hidden="true"></i>
          }
          <div class="content">
            <h3>{{ b.title }}</h3>
            @if (b.text) { <p>{{ b.text }}</p> }
            @if (b.link && b.buttonText) {
              <button type="button" class="cta" (click)="open(b); $event.stopPropagation()">
                {{ b.buttonText }}
                <i class="bi" [ngClass]="external(b) ? 'bi-box-arrow-up-right' : 'bi-arrow-right'"></i>
              </button>
            }
          </div>
        </article>
      }
    </div>

    @if (stops > 1) {
      <button type="button" class="nav prev" (click)="go(index - 1)" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
      <button type="button" class="nav next" (click)="go(index + 1)" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
      <div class="dots">
        @for (d of dotList(); track d) {
          <button type="button" [class.on]="d === index" (click)="go(d)" [attr.aria-label]="'Show card ' + (d + 1)"></button>
        }
      </div>
    }
  </section>
}
