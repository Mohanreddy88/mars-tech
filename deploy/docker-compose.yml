# HRMS on Hostinger VPS — run from the deploy/ folder:
#   docker compose up -d --build
name: hrms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Kuala_Lumpur
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published — database is reachable only inside the Docker network

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hrms-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      UsePostgreSQL: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      DB_AUTO_CREATE: "true"
      FrontendUrl: ${FRONTEND_URL:-https://marshrms.com}   # base URL for links in emails (password reset)
      # Several companies, one database each, chosen by web address (esync.marshrms.com → hrms_esync).
      # Super Admin portal: admin.marshrms.com — first login "superadmin" with SUPERADMIN_PASSWORD.
      Tenancy__Enabled: "true"
      Tenancy__BaseDomains: ${TENANT_DOMAINS:-marshrms.com,marstech.tech}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HRMS Payroll}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
    volumes:
      - uploads:/app/api/wwwroot/uploads
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - web   # shared with the UAT stack so Caddy can reach uat-app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  web:
    external: true   # created by deploy.sh / deploy-uat.sh: docker network create web
