# Public website (website/ in the repo) on the bare domain: marshrms.com, and uat.marshrms.com on UAT.
# The app itself lives on company addresses (demo.marshrms.com, esync.marshrms.com, …) — the server below.
server {
    listen 8080;
    server_name marshrms.com uat.marshrms.com;
    root /app/website;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # The website's contact form (and old API clients of the demo company) still reach the API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60;
    }

    # Old app links on the bare domain (emails, bookmarks) → the demo company's own address
    location ~ ^/(login|forgot-password|reset-password|change-password|privacy|terms|dashboard|home|analytics|employees|attendance|payroll|timesheets|leave|reports|self-service|master|school|parent|notifications|audit|users)(/|$) {
        return 302 https://demo.$host$request_uri;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 1d;
        access_log off;
    }

    # Clean addresses: /features → features.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}

server {
    listen 8080 default_server;
    server_name _;
    root /app/wwwroot;
    index index.html;

    client_max_body_size 25m;
    server_tokens off;

    # Profile pictures: UI requests /api/uploads/..., files live in the API's wwwroot
    # ^~ so the image-caching rule below (*.png, *.jpg …) does not take these requests
    location ^~ /api/uploads/ {
        alias /app/api/wwwroot/uploads/;
        expires 7d;
    }

    # Live school messages (SignalR): WebSocket upgrade, kept open for a long time
    location ^~ /api/hubs/ {
        proxy_pass http://127.0.0.1:5000/api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;
    }

    # Class stories: videos up to 100 MB are uploaded and streamed (range requests) without buffering.
    # No trailing slash: "/api/school/stories/" made nginx answer POST/GET /api/school/stories (create,
    # list) with a 301 to the slash address on the internal port. proxy_pass without a path keeps the URI.
    location ^~ /api/school/stories {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900;
        proxy_send_timeout 900;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        proxy_connect_timeout 60;
        proxy_send_timeout 300;
    }

    # Hashed Angular bundles can be cached long-term
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
