name: hrms_mobile
description: HRMS employee self-service mobile app (talks to HrmsApi).
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  intl: ^0.19.0
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  share_plus: ^12.0.2
  # Leave documents: camera / gallery photo. (file_picker was tried but does not
  # compile with this project's Android Kotlin setup; image_picker is Java.)
  image_picker: ^1.2.4
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon: `dart run flutter_launcher_icons` regenerates Android + iOS icons from the logo.
flutter_launcher_icons:
  image_path: assets/icon/mars_hrms_logo.jpeg
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/mars_hrms_logo.jpeg
  adaptive_icon_foreground_inset: 18
